x-router: &router
  image: quay.io/frrouting/frr:10.7.0
  privileged: true
  sysctls:
    - net.ipv4.ip_forward=1

services:
  r1:
    <<: *router
    container_name: r1
    hostname: r1
    volumes:
      - ./configs/daemons:/etc/frr/daemons
      - ./configs/r1.conf:/etc/frr/frr.conf
      - ./configs/vtysh.conf:/etc/frr/vtysh.conf
    networks:
      net12: { ipv4_address: 10.0.12.11 }
      net13: { ipv4_address: 10.0.13.11 }
  r2:
    <<: *router
    container_name: r2
    hostname: r2
    volumes:
      - ./configs/daemons:/etc/frr/daemons
      - ./configs/r2.conf:/etc/frr/frr.conf
      - ./configs/vtysh.conf:/etc/frr/vtysh.conf
    networks:
      net12: { ipv4_address: 10.0.12.12 }
      net23: { ipv4_address: 10.0.23.12 }
  r3:
    <<: *router
    container_name: r3
    hostname: r3
    volumes:
      - ./configs/daemons:/etc/frr/daemons
      - ./configs/r3.conf:/etc/frr/frr.conf
      - ./configs/vtysh.conf:/etc/frr/vtysh.conf
    networks:
      net13: { ipv4_address: 10.0.13.13 }
      net23: { ipv4_address: 10.0.23.13 }

# internal: true  -> no gateway, so no default route out to the internet. 1.1.1.1 is a
#   real public address; without this a ping test could pass with OSPF broken.
# driver: macvlan -> NOT the default bridge driver. Docker's firewall on internal
#   *bridge* networks drops any packet whose destination is outside the subnet,
#   which includes OSPF Hellos to multicast 224.0.0.5, so neighbours never form.
#   macvlan traffic bypasses those bridge rules, so multicast gets through.
networks:
  net12:
    name: net12
    driver: macvlan
    internal: true
    ipam:
      config:
        - subnet: 10.0.12.0/24
  net13:
    name: net13
    driver: macvlan
    internal: true
    ipam:
      config:
        - subnet: 10.0.13.0/24
  net23:
    name: net23
    driver: macvlan
    internal: true
    ipam:
      config:
        - subnet: 10.0.23.0/24
